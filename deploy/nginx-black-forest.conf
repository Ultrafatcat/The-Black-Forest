# nginx sits in front of the Node app as a reverse proxy.
#
# Why bother? Node listens on port 3000 as an unprivileged user. Visitors
# expect port 80. nginx takes port 80, hands requests to Node, and is also
# the place you'd later add HTTPS, caching, and rate limiting.
#
# setup-ec2.sh copies this to /etc/nginx/conf.d/black-forest.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}